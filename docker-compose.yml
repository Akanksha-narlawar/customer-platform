services:

  database:
    image: mysql:8.4
    container_name: ${DB_CONTAINER}
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - customer-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  application:
    image: ${IMAGE_NAME}
    container_name: ${APP_CONTAINER}
    ports:
      - "${HOST_PORT}:5000"
    environment:
      APP_VERSION: ${APP_VERSION}
      ENVIRONMENT: ${ENVIRONMENT}
      DB_HOST: ${DB_CONTAINER}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - customer-network

networks:
  customer-network:
    name: ${NETWORK_NAME}
    driver: bridge

volumes:
  db-data:
    name: ${DB_VOLUME}